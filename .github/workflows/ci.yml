name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notifica_fight
          POSTGRES_USER: notifica
          POSTGRES_PASSWORD: notifica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifica -d notifica_fight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://notifica:notifica_ci@localhost:5432/notifica_fight?schema=public
      CORS_ORIGINS: ""
      SWAGGER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.2.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @notifica-fight/api test:e2e
      - run: pnpm --filter @notifica-fight/api test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug lintRelease assembleRelease
